name: CI and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish the current publication before starting the latest queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Validate game and upload site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check JavaScript and game state transitions
        run: npm run check

      - name: Upload the static game
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@v4
